name: CI/CD

on:
  push:
    branches: [main, develop, fix/product-offer-priority-20260912]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    # Сборка должна проверять код, но не подключаться к боевой базе.
    # Значение используется только для безопасной инициализации DB-модуля:
    # статические страницы и API-роуты не выполняют запросы к нему во время build.
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/brocar_ci
      NEXT_TELEMETRY_DISABLED: 1
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Совпадает с базовым образом production в Dockerfile.
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run TypeScript type check
        run: npm run type-check
      
      - name: Build project
        run: npm run build

  # Add more jobs here as needed:
  # - test (when you add tests)
  # - security-scan
  # - deploy (for custom deployment)




