# Финальный конфиг сайта brocarparts.ru → /etc/nginx/sites-available/brocar
# (sites-enabled/brocar — симлинк на него). Воспроизводит текущую структуру с
# certbot-SSL и редиректом с 80, ДОБАВЛЯЯ кэш-location для /api/(catalog|product).
# Требует /etc/nginx/conf.d/brocar-cache.conf (зона brocar, map $brocar_no_cache,
# upstream brocar_next, gzip_types) — копируется из nginx-cache.conf.

server {
    server_name brocarparts.ru www.brocarparts.ru;

    # Общий лимит частоты и числа соединений на IP (зоны — в brocar-cache.conf).
    # burst=60 nodelay: всплеск при открытии страницы проходит мгновенно, а
    # ровный поток скрипта режется. Статика /_next/* не считается (см. map).
    limit_req  zone=brocar_general burst=60 nodelay;
    limit_conn brocar_conn 40;

    # Живой поиск по поставщикам — отдельный, жёсткий лимит: роут ходит в 7
    # внешних API, и именно его заваливал бот (59 × HTTP 499 за сутки).
    location = /api/suppliers/search {
        limit_req zone=brocar_search burst=10 nodelay;

        proxy_pass http://brocar_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Вебхук ЮKassa от лимита освобождён — но НЕ здесь: у limit_req нет параметра
    # `off` (nginx падает с «invalid parameter "off"»). Исключение сделано в
    # brocar-cache.conf через пустой ключ в map $brocar_limit_key — такие запросы
    # nginx не учитывает вовсе. Деньги важнее защиты от спама: пропущенный вебхук
    # = оплаченный заказ, застрявший в «ожидает оплаты».

    # Сборочная статика Next (/_next/*) — у неё Next уже ставит immutable-кэш на
    # год, и портить его нельзя. Префикс с `^~` означает «совпало — регулярки
    # дальше не проверять», поэтому блок ниже с картинками её не перехватит.
    location ^~ /_next/ {
        proxy_pass http://brocar_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Кэшируемые ПУБЛИЧНЫЕ GET: каталог, карточка товара (/api/product/…),
    # картинки (/api/product-image). Только без cookie ($brocar_no_cache) —
    # корзина/профиль/админка/auth в общий кэш не попадают. TTL берётся из
    # Cache-Control ответа (s-maxage): меню — сутки, листинги — 10 мин, товар — 60 с.
    location ~ ^/api/(catalog|product) {
        proxy_pass http://brocar_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache brocar;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
        proxy_cache_background_update on;
        proxy_cache_lock on;                  # параллельные промахи → один backend-запрос
        proxy_no_cache $brocar_no_cache;      # не сохранять, если есть cookie
        proxy_cache_bypass $brocar_no_cache;  # не отдавать из кэша, если есть cookie
        add_header X-Cache-Status $upstream_cache_status always;  # MISS/HIT/UPDATING — для проверки
    }

    # Статика из public/ (логотип, favicon, иконки разделов, логотипы брендов).
    # Next отдаёт её с `Cache-Control: public, max-age=0`, поэтому браузер
    # перепроверяет каждый файл при каждом переходе по сайту: один посетитель за
    # день дал 186 запросов за логотипом и 140 за манифестом. Файл при этом не
    # перекачивается заново, но лишний сетевой раунд-трип на мобильной сети заметен.
    #
    # Ставим ровно сутки — компромисс: повторные заходы идут из кэша браузера, а
    # заменённая картинка доезжает до людей максимум за 24 часа. Больше нельзя:
    # имена файлов в public/ без хэша, и подменённый логотип завис бы у людей
    # надолго (если нужно мгновенно — переименуй файл).
    #
    # СТОИТ НИЖЕ кэш-локации /api/(catalog|product) намеренно: nginx проверяет
    # регулярки сверху вниз и берёт первую совпавшую, поэтому API-роуты должны
    # разбираться раньше. Сборочную статику Next перехватывает `location ^~
    # /_next/` выше — префикс с ^~ выигрывает у регулярок, её immutable-кэш цел.
    location ~* \.(png|jpe?g|webp|avif|svg|ico|webmanifest|woff2?)$ {
        proxy_pass http://brocar_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Снимаем max-age=0 от Next и ставим свой — иначе в ответе будет ДВА
        # заголовка Cache-Control и браузер выберет непредсказуемо.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/brocarparts.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/brocarparts.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.brocarparts.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = brocarparts.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name brocarparts.ru www.brocarparts.ru;
    return 404; # managed by Certbot
}
