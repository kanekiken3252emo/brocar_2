# Кэширующий слой nginx для brocarparts.ru (http-контекст).
# Положить на VPS в /etc/nginx/conf.d/brocar-cache.conf — он подключается из
# блока http{} основного /etc/nginx/nginx.conf (там есть `include conf.d/*.conf;`).
# Сами location-блоки, использующие этот кэш, — в server-блоке (см. nginx.conf).
#
# Зачем: перед Next сейчас голый reverse-proxy, поэтому Cache-Control (s-maxage),
# который ставят роуты каталога, НЕКОМУ исполнять — каждый аноним-запрос долетает
# до Node и удалённой Supabase (cold до 3.4с). Этот кэш держит повторные ответы в
# nginx (TTFB ~10мс), а proxy_cache_lock схлопывает параллельные промахи в один
# backend-запрос — убирает холодный старт для всех, кроме первого.

# Диск-кэш: 50МБ ключей в памяти, до 1ГБ файлов, чистка после суток простоя.
proxy_cache_path /var/cache/nginx/brocar levels=1:2 keys_zone=brocar:50m
                 max_size=1g inactive=24h use_temp_path=off;

# Любая непустая cookie (залогинен/корзина/сессия) → НЕ кэшировать этот запрос.
# Защищает от утечки персонализированных ответов между пользователями.
map $http_cookie $brocar_no_cache {
    default 0;
    "~."    1;
}

# Сжатие текстовых ответов (крупный JSON каталога особенно выигрывает на мобильной сети).
# ВАЖНО: `gzip on;` НЕ дублируем — он уже включён в основном /etc/nginx/nginx.conf
# (повтор директивы gzip = ошибка конфига). Здесь только донастройка: по умолчанию
# nginx сжимает лишь text/html и НЕ трогает проксированные ответы — добавляем JSON и proxied.
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_types        application/json application/javascript text/css text/plain image/svg+xml;

# Keep-alive пул к Next — без переустановки TCP на каждый прокси-запрос.
upstream brocar_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── Защита от ботов/спама: лимиты частоты по IP ──────────────────────────────
# Повод: один IP давал 16 441 запрос в сутки (пик 14 389 за час) — это скрипт, не
# человек. Он занимал Node и дёргал API поставщиков, из-за чего живые запросы
# вставали в очередь. Лимиты подобраны так, чтобы человек в них не упирался.

# Ключ общего лимита. Для статики Next (/_next/*) ключ ПУСТОЙ — такие запросы
# nginx не считает вовсе: одна страница тянет десятки чанков разом, и без этого
# исключения обычная загрузка сайта сама себя зарубила бы на 429.
map $request_uri $brocar_limit_key {
    default     $binary_remote_addr;
    "~^/_next/" "";
}

# Общий потолок: 30 динамических запросов в секунду с IP.
limit_req_zone $brocar_limit_key zone=brocar_general:10m rate=30r/s;

# Живой поиск по поставщикам — самый дорогой роут (ходит в 7 внешних API).
# 20 запросов в минуту с IP: человек так часто не ищет, парсер — постоянно.
limit_req_zone $binary_remote_addr zone=brocar_search:10m rate=20r/m;

# Одновременных соединений с одного IP.
limit_conn_zone $binary_remote_addr zone=brocar_conn:10m;

# 429 «Too Many Requests» вместо дефолтной 503 — честный код для клиента и
# мониторинга. Превышения пишем как warn, чтобы не топить error.log.
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;
